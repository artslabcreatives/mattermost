map $http_upgrade $connection_upgrade_staging {
    default upgrade;
    '' close;
}

server {
    server_name staging.collab.artslabcreatives.com;

    access_log /var/log/nginx/mattermost-staging.access.log;
    error_log  /var/log/nginx/mattermost-staging.error.log;

    client_max_body_size 10000M;

    location ^~ /api/v4/files/tus/ {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ /api/v4/websocket {
        proxy_pass http://127.0.0.1:8066;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cookie_path / "/; SameSite=None; Secure; HttpOnly";
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.collab.artslabcreatives.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.collab.artslabcreatives.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = staging.collab.artslabcreatives.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name staging.collab.artslabcreatives.com;

    listen 80;
    return 404; # managed by Certbot


}
